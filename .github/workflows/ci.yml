name: Django CI Pipeline

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
        # This is the way to write Postgres Connection in yml
            postgres:
                image: postgres:15
                env:
                    POSTGRES_DB: dummyportfolio
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres -d dummyportfolio"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        env:
            SECRET_KEY: dummykey
            # Always quote the True value for env otherwise the yml will take it as boolean
            DEBUG: 'True'
            DB_NAME: dummyportfolio
            DB_USER: postgres  
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DJANGO_SETTINGS_MODULE: backend.settings
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.10'

            - name: Cache pip dependencies
              uses: actions/cache@v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
                restore-keys: |
                    ${{ runner.os }}-pip-

            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Wait for Postgres to be Ready
              run: |
                until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do
                echo "Waiting for Postgres to start..."
                sleep 3
                done
                echo "Postgres is ready!"


            - name: Run Migrations
              run: |
                python manage.py migrate --noinput

            - name: Run Tests
              run: |
                python manage.py test

                            

                

